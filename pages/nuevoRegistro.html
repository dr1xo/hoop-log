
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Registro</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="app-header">
        <div class="marca">
            <h1>HoopLog</h1>
        </div>
        <nav class ="app-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="historial.html">Historial</a></li>
            </ul>
        </nav>
    </header>

<section>

    <h2>Nuevo Registro</h2>
   


    <form class="record-form" action="#" method="POST">
        
        <!-- DATOS GENERALES -->
        <div class="form-group">
        <label for="activity-type">Tipo de actividad</label>
        <select id="activity-type" name="type" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="gimnasio">Gimnasio</option>
            <option value="basquet">Básquet</option>
        </select>
        </div>

        <div class="form-row">
        <div class="form-group">
            <label for="activity-date">Fecha</label>
            <input type="date" id="activity-date" name="date" required>
        </div>

        <div class="form-group">
            <label for="activity-duration">Duración (minutos)</label>
            <input type="number" id="activity-duration" name="duration" min="1" placeholder="Ej. 60" required>
        </div>
        </div>

        <!-- BLOQUE ESPECÍFICO: GIMNASIO -->
        <fieldset class="fieldset-group group-gym">
        <legend>🏋️ Detalles de Gimnasio</legend>
        
        <div class="form-group">
            <label for="gym-exercise">Ejercicio</label>
            <input type="text" id="gym-exercise" name="gym_exercise" placeholder="Ej. Sentadilla, Press de banca">
        </div>

        <div class="form-row-three">
            <div class="form-group">
            <label for="gym-sets">Series</label>
            <input type="number" id="gym-sets" name="gym_sets" min="1" placeholder="4">
            </div>
            <div class="form-group">
            <label for="gym-reps">Repeticiones</label>
            <input type="number" id="gym-reps" name="gym_reps" min="1" placeholder="10">
            </div>
            <div class="form-group">
            <label for="gym-weight">Peso (kg)</label>
            <input type="number" id="gym-weight" name="gym_weight" min="0" step="0.5" placeholder="60">
            </div>
        </div>
        </fieldset>

        <!-- BLOQUE ESPECÍFICO: BÁSQUET -->
        <fieldset class="fieldset-group group-basketball">
        <legend>🏀 Detalles de Básquet</legend>

        <div class="form-row-three">
            <div class="form-group">
            <label for="bball-points">Puntos</label>
            <input type="number" id="bball-points" name="bball_points" min="0" placeholder="18">
            </div>
            <div class="form-group">
            <label for="bball-rebounds">Rebotes</label>
            <input type="number" id="bball-rebounds" name="bball_rebounds" min="0" placeholder="6">
            </div>
            <div class="form-group">
            <label for="bball-assists">Asistencias</label>
            <input type="number" id="bball-assists" name="bball_assists" min="0" placeholder="4">
            </div>
        </div>
        </fieldset>

        <!-- NOTAS ADICIONALES -->
        <div class="form-group">
        <label for="activity-notes">Notas</label>
        <textarea id="activity-notes" name="notes" rows="3" placeholder="Detalles o sensaciones adicionales..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Guardar registro</button>

    </form>
</section>
</body>
